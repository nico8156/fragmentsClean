AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub OIDC role for immutable Fragments Studio staging releases.

Parameters:
  GitHubOidcProviderArn:
    Type: String
    Default: arn:aws:iam::851725375299:oidc-provider/token.actions.githubusercontent.com
  GitHubRepository:
    Type: String
    Default: nico8156/fragmentsAdmin
  GitHubEnvironment:
    Type: String
    Default: staging
  StudioBucketName:
    Type: String
    Default: fragments-studio-staging-851725375299
  StudioDistributionId:
    Type: String
    Description: CloudFront distribution serving the Studio staging bucket.

Resources:
  GitHubStudioDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: fragments-studio-staging-github-deploy
      Description: GitHub Actions role restricted to immutable Studio releases and CloudFront invalidations.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: fragments-studio-staging-release
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadAndPublishStudioObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${StudioBucketName}/*
              - Sid: ListStudioBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${StudioBucketName}
              - Sid: InvalidateStudioDistribution
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${StudioDistributionId}

Outputs:
  GitHubStudioDeployRoleArn:
    Value: !GetAtt GitHubStudioDeployRole.Arn
  StudioBucketName:
    Value: !Ref StudioBucketName
  StudioDistributionId:
    Value: !Ref StudioDistributionId
