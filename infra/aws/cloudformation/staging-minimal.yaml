AWSTemplateFormatVersion: '2010-09-09'
Description: Fragments staging minimal infrastructure for a single-host Docker Compose deployment.

Parameters:
  ProjectName:
    Type: String
    Default: fragments
  EnvironmentName:
    Type: String
    Default: staging
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair name for SSH access.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the staging instance will run.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet where the staging instance will run.
  AllowedSshCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to access SSH. Tighten immediately after bootstrap or use SSM.
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues:
      - t4g.small
      - t4g.medium
  RootVolumeSizeGiB:
    Type: Number
    Default: 30
    MinValue: 16
  DataVolumeSizeGiB:
    Type: Number
    Default: 30
    MinValue: 20
  UbuntuAmiParameter:
    Type: String
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id
  GitHubRepository:
    Type: String
    Default: nico8156/fragmentsClean
    Description: GitHub repository allowed to assume the deploy role, formatted owner/repo.
  GitHubBranch:
    Type: String
    Default: main
    Description: GitHub branch allowed to assume the deploy role.
  SsmDeployInstanceId:
    Type: String
    Default: i-004d3e9cbca327d01
    Description: Platform EC2 instance targeted by the SSM deployment workflow.
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: Existing token.actions.githubusercontent.com OIDC provider ARN. Leave empty in a fresh AWS account.

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, '']

Resources:
  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${ProjectName}/${EnvironmentName}/backend
      ImageScanningConfiguration:
        ScanOnPush: true

  SharedDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-${EnvironmentName}-shared-dlq
      MessageRetentionPeriod: 1209600

  ArticlesEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-${EnvironmentName}-articles-events
      VisibilityTimeout: 120
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SharedDeadLetterQueue.Arn
        maxReceiveCount: 5

  AuthUsersEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-${EnvironmentName}-auth-users-events
      VisibilityTimeout: 120
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SharedDeadLetterQueue.Arn
        maxReceiveCount: 5

  AppUsersEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-${EnvironmentName}-app-users-events
      VisibilityTimeout: 120
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SharedDeadLetterQueue.Arn
        maxReceiveCount: 5

  CoffeesEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-${EnvironmentName}-coffees-events
      VisibilityTimeout: 120
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SharedDeadLetterQueue.Arn
        maxReceiveCount: 5

  DomainEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-${EnvironmentName}-domain-events
      VisibilityTimeout: 120
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SharedDeadLetterQueue.Arn
        maxReceiveCount: 5

  TicketEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-${EnvironmentName}-ticket-events
      VisibilityTimeout: 120
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SharedDeadLetterQueue.Arn
        maxReceiveCount: 5

  TicketVerificationRequestedQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-${EnvironmentName}-ticket-verification-requested
      VisibilityTimeout: 120
      ReceiveMessageWaitTimeSeconds: 20
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SharedDeadLetterQueue.Arn
        maxReceiveCount: 5

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${ProjectName}-${EnvironmentName} instance security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSshCidr
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: !Sub ${ProjectName}-${EnvironmentName}-runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  - !GetAtt BackendRepository.Arn
              - Effect: Allow
                Action:
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:SendMessage
                Resource:
                  - !GetAtt SharedDeadLetterQueue.Arn
                  - !GetAtt ArticlesEventsQueue.Arn
                  - !GetAtt AuthUsersEventsQueue.Arn
                  - !GetAtt AppUsersEventsQueue.Arn
                  - !GetAtt CoffeesEventsQueue.Arn
                  - !GetAtt DomainEventsQueue.Arn
                  - !GetAtt TicketEventsQueue.Arn
                  - !GetAtt TicketVerificationRequestedQueue.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - arn:aws:s3:::anchor-assets-prod-851725375299/fragments/staging/*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: arn:aws:s3:::anchor-assets-prod-851725375299
                Condition:
                  StringLike:
                    s3:prefix:
                      - fragments/staging/coffees/*

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  DataVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !GetAtt StagingInstance.AvailabilityZone
      Encrypted: true
      Size: !Ref DataVolumeSizeGiB
      VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-data

  StagingInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub '{{resolve:ssm:${UbuntuAmiParameter}}}'
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !Ref KeyPairName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref RootVolumeSizeGiB
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y ca-certificates curl gnupg lsb-release jq unzip

          install -m 0755 -d /etc/apt/keyrings
          if [ ! -f /etc/apt/keyrings/docker.gpg ]; then
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          fi
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          systemctl enable docker
          systemctl start docker
          usermod -aG docker ubuntu

          if ! command -v aws >/dev/null 2>&1; then
            cd /tmp
            rm -rf aws awscliv2.zip
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o awscliv2.zip
            unzip -q awscliv2.zip
            ./aws/install
            rm -rf aws awscliv2.zip
          fi

          mkdir -p /srv/fragments/staging
          chown -R ubuntu:ubuntu /srv/fragments
          chmod 750 /srv/fragments /srv/fragments/staging

          for _ in $(seq 1 30); do
            [ -b /dev/nvme1n1 ] && break
            sleep 2
          done
          test -b /dev/nvme1n1

          if ! blkid /dev/nvme1n1 >/dev/null 2>&1; then
            mkfs.ext4 -F /dev/nvme1n1
          fi

          mkdir -p /srv/fragments-postgres
          DATA_VOLUME_UUID=$(blkid -s UUID -o value /dev/nvme1n1)
          grep -q "$DATA_VOLUME_UUID" /etc/fstab || echo "UUID=$DATA_VOLUME_UUID /srv/fragments-postgres ext4 defaults,nofail 0 2" >> /etc/fstab
          mountpoint -q /srv/fragments-postgres || mount /srv/fragments-postgres

  DataVolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/sdf
      InstanceId: !Ref StagingInstance
      VolumeId: !Ref DataVolume

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref StagingInstance
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-eip

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub GitHub Actions deploy role for ${ProjectName} ${EnvironmentName}.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:ref:refs/heads/${GitHubBranch}
      Policies:
        - PolicyName: !Sub ${ProjectName}-${EnvironmentName}-backend-ecr-push
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrAuthorizationToken
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: PushBackendImage
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeRepositories
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !GetAtt BackendRepository.Arn
              - Sid: ReadStagingStackOutputs
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/platform-staging/*
              - Sid: DeployThroughSsm
                Effect: Allow
                Action:
                  - ssm:SendCommand
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript
                  - !Sub arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${SsmDeployInstanceId}
              - Sid: ReadSsmCommandResult
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                Resource: '*'

Outputs:
  InstanceId:
    Value: !Ref StagingInstance
  InstancePublicIp:
    Value: !Ref ElasticIp
  InstancePublicDnsName:
    Value: !GetAtt StagingInstance.PublicDnsName
  InstanceSecurityGroupId:
    Value: !Ref InstanceSecurityGroup
  EcrRepositoryUri:
    Value: !GetAtt BackendRepository.RepositoryUri
  ArticlesEventsQueueUrl:
    Value: !Ref ArticlesEventsQueue
  AuthUsersEventsQueueUrl:
    Value: !Ref AuthUsersEventsQueue
  AppUsersEventsQueueUrl:
    Value: !Ref AppUsersEventsQueue
  CoffeesEventsQueueUrl:
    Value: !Ref CoffeesEventsQueue
  DomainEventsQueueUrl:
    Value: !Ref DomainEventsQueue
  TicketEventsQueueUrl:
    Value: !Ref TicketEventsQueue
  TicketVerificationRequestedQueueUrl:
    Value: !Ref TicketVerificationRequestedQueue
  SharedDeadLetterQueueUrl:
    Value: !Ref SharedDeadLetterQueue
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
