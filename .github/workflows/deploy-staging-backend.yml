name: Deploy Staging Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'bin/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'infra/aws/compose/staging/**'
      - '.github/workflows/deploy-staging-backend.yml'

env:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: ${{ secrets.STAGING_ECR_REPOSITORY }}
  STAGING_SECURITY_GROUP_ID: ${{ secrets.STAGING_SECURITY_GROUP_ID }}
  STAGING_REMOTE_DIR: /srv/fragments/staging
  STAGING_STACK_NAME: fragments-staging-minimal

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test backend deployment guard
        run: |
          ./mvnw -q \
            -Dtest=CreateArticleCommandHandlerTest,MakeLikeCommandHandlerTest,CreateCommentCommandHandlerTest,UpdateCommentCommandHandlerTest,SocialEventRoutingTest,DeleteCommentCommandHandlerTest,VerifyTicketCommandHandlerTest,IntegrationEventEnvelopeFactoryTest,StableEnvelopeOutboxEventSenderTest,CreateCoffeeCommandHandlerTest \
            test

      - name: Package backend
        run: ./mvnw -q -DskipTests package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve staging SQS queue URLs
        run: |
          set -euo pipefail
          stack_outputs_json="$(aws cloudformation describe-stacks \
            --region "${AWS_REGION}" \
            --stack-name "${STAGING_STACK_NAME}" \
            --query 'Stacks[0].Outputs' \
            --output json)"

          resolve_output() {
            local output_key="$1"
            local env_key="$2"
            local value
            value="$(STACK_OUTPUTS_JSON="${stack_outputs_json}" OUTPUT_KEY="${output_key}" python3 - <<'PY'
          import json
          import os

          outputs = json.loads(os.environ["STACK_OUTPUTS_JSON"])
          output_key = os.environ["OUTPUT_KEY"]
          for output in outputs:
              if output.get("OutputKey") == output_key:
                  print(output.get("OutputValue", ""))
                  break
          PY
          )"
            if [ -z "${value}" ] || [ "${value}" = "None" ]; then
              echo "::error::Missing CloudFormation output ${output_key} in stack ${STAGING_STACK_NAME}."
              exit 1
            fi
            echo "${env_key}=${value}" >> "${GITHUB_ENV}"
          }

          resolve_output ArticlesEventsQueueUrl SQS_ARTICLES_EVENTS_URL
          resolve_output AuthUsersEventsQueueUrl SQS_AUTH_USERS_EVENTS_URL
          resolve_output AppUsersEventsQueueUrl SQS_APP_USERS_EVENTS_URL
          resolve_output CoffeesEventsQueueUrl SQS_COFFEES_EVENTS_URL
          resolve_output DomainEventsQueueUrl SQS_DOMAIN_EVENTS_URL
          resolve_output TicketEventsQueueUrl SQS_TICKET_EVENTS_URL
          resolve_output TicketVerificationRequestedQueueUrl SQS_TICKET_VERIFICATION_REQUESTED_URL

      - name: Validate staging deployment secrets
        run: |
          test -n "${ECR_REPOSITORY}"
          CLEAN_ECR_REPOSITORY="$(printf '%s' "${ECR_REPOSITORY}" | tr -d '[:space:]')"
          if [ "${CLEAN_ECR_REPOSITORY}" != "${ECR_REPOSITORY}" ]; then
            echo "::error::STAGING_ECR_REPOSITORY must not contain spaces or newlines."
            exit 1
          fi
          case "${ECR_REPOSITORY}" in
            http://*|https://*)
              echo "::error::STAGING_ECR_REPOSITORY must be an ECR repository URI without protocol."
              exit 1
              ;;
            *:*)
              echo "::error::STAGING_ECR_REPOSITORY must not include an image tag."
              exit 1
              ;;
          esac
          echo "ECR_REPOSITORY=${ECR_REPOSITORY}" >> "${GITHUB_ENV}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push staging backend image
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          test -n "${ECR_REPOSITORY}"
          docker buildx build \
            --platform linux/arm64 \
            --tag "${ECR_REPOSITORY}:${IMAGE_TAG}" \
            --tag "${ECR_REPOSITORY}:staging-latest" \
            --file Dockerfile \
            . \
            --push

      - name: Authorize runner SSH ingress
        run: |
          test -n "${STAGING_SECURITY_GROUP_ID}"
          RUNNER_PUBLIC_IP="$(curl -fsSL https://checkip.amazonaws.com | tr -d '[:space:]')"
          test -n "${RUNNER_PUBLIC_IP}"
          echo "RUNNER_PUBLIC_IP=${RUNNER_PUBLIC_IP}" >> "${GITHUB_ENV}"
          aws ec2 authorize-security-group-ingress \
            --region "${AWS_REGION}" \
            --group-id "${STAGING_SECURITY_GROUP_ID}" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_PUBLIC_IP}/32" || true

      - name: Write SSH private key
        env:
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          for _ in $(seq 1 10); do
            ssh-keyscan -T 10 -H "${{ secrets.STAGING_EC2_HOST }}" >> ~/.ssh/known_hosts && exit 0
            sleep 5
          done
          echo "::error::Unable to scan staging SSH host key. Check Security Group port 22 and STAGING_EC2_HOST."
          exit 1

      - name: Sync deployment files
        run: |
          ssh -i ~/.ssh/staging_key "${{ secrets.STAGING_EC2_USER }}@${{ secrets.STAGING_EC2_HOST }}" \
            "mkdir -p '${STAGING_REMOTE_DIR}/db'"
          scp -i ~/.ssh/staging_key \
            infra/aws/compose/staging/docker-compose.yml \
            "${{ secrets.STAGING_EC2_USER }}@${{ secrets.STAGING_EC2_HOST }}:${STAGING_REMOTE_DIR}/docker-compose.yml"
          scp -i ~/.ssh/staging_key \
            infra/aws/compose/staging/Caddyfile \
            "${{ secrets.STAGING_EC2_USER }}@${{ secrets.STAGING_EC2_HOST }}:${STAGING_REMOTE_DIR}/Caddyfile"
          scp -i ~/.ssh/staging_key \
            src/main/resources/schema.sql \
            "${{ secrets.STAGING_EC2_USER }}@${{ secrets.STAGING_EC2_HOST }}:${STAGING_REMOTE_DIR}/db/schema.sql"
          scp -i ~/.ssh/staging_key \
            src/main/resources/data.sql \
            "${{ secrets.STAGING_EC2_USER }}@${{ secrets.STAGING_EC2_HOST }}:${STAGING_REMOTE_DIR}/db/data.sql"

      - name: Deploy on staging host
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          require_env() {
            key="$1"
            if [ -z "${!key:-}" ]; then
              echo "::error::Required environment variable ${key} is empty."
              exit 1
            fi
          }
          require_env GOOGLE_PLACES_API_KEY
          require_env SQS_ARTICLES_EVENTS_URL
          require_env SQS_AUTH_USERS_EVENTS_URL
          require_env SQS_APP_USERS_EVENTS_URL
          require_env SQS_COFFEES_EVENTS_URL
          require_env SQS_DOMAIN_EVENTS_URL
          require_env SQS_TICKET_EVENTS_URL
          require_env SQS_TICKET_VERIFICATION_REQUESTED_URL
          ssh -i ~/.ssh/staging_key "${{ secrets.STAGING_EC2_USER }}@${{ secrets.STAGING_EC2_HOST }}" <<EOF
          set -euo pipefail
          set +x
          cd "${STAGING_REMOTE_DIR}"
          test -f .env
          upsert_env_var() {
            key="\$1"
            value="\$2"
            if grep -q "^\${key}=" .env; then
              sed -i "s|^\${key}=.*|\${key}=\${value}|" .env
            else
              printf '\n%s=%s\n' "\${key}" "\${value}" >> .env
            fi
          }
          upsert_env_var "BACKEND_IMAGE" "${ECR_REPOSITORY}:${IMAGE_TAG}"
          upsert_env_var "GOOGLE_PLACES_API_KEY" "${GOOGLE_PLACES_API_KEY}"
          upsert_env_var "APP_MESSAGING_SQS_ENABLED" "true"
          upsert_env_var "APP_MESSAGING_KAFKA_ENABLED" "false"
          upsert_env_var "SQS_ARTICLES_EVENTS_URL" "${SQS_ARTICLES_EVENTS_URL}"
          upsert_env_var "SQS_AUTH_USERS_EVENTS_URL" "${SQS_AUTH_USERS_EVENTS_URL}"
          upsert_env_var "SQS_APP_USERS_EVENTS_URL" "${SQS_APP_USERS_EVENTS_URL}"
          upsert_env_var "SQS_COFFEES_EVENTS_URL" "${SQS_COFFEES_EVENTS_URL}"
          upsert_env_var "SQS_DOMAIN_EVENTS_URL" "${SQS_DOMAIN_EVENTS_URL}"
          upsert_env_var "SQS_TICKET_EVENTS_URL" "${SQS_TICKET_EVENTS_URL}"
          upsert_env_var "SQS_TICKET_VERIFICATION_REQUESTED_URL" "${SQS_TICKET_VERIFICATION_REQUESTED_URL}"
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_REPOSITORY%/*}"
          docker compose pull backend
          docker compose up -d postgres
          docker compose exec -T postgres \
            psql -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" \
            -f /docker-entrypoint-initdb.d/01-schema.sql
          docker compose up -d backend
          if grep -q '^COMPOSE_PROFILES=.*https' .env; then
            docker compose --profile https up -d caddy
          fi
          docker compose ps
          EOF

      - name: Smoke test staging backend
        run: |
          ssh -T -o LogLevel=ERROR -i ~/.ssh/staging_key "${{ secrets.STAGING_EC2_USER }}@${{ secrets.STAGING_EC2_HOST }}" 'bash -seuo pipefail' <<'EOF'
          cd /srv/fragments/staging
          status_code=""
          for _ in $(seq 1 30); do
            status_code=$(curl -s -o /tmp/fragments-health.json -w '%{http_code}' "http://127.0.0.1:8080/actuator/health" || true)
            echo "fragments staging health status: ${status_code}"
            if [ "$status_code" = "200" ]; then
              cat /tmp/fragments-health.json
              exit 0
            fi
            sleep 5
          done
          echo "Backend smoke test failed after retries with status: ${status_code:-none}"
          docker compose ps || true
          docker compose logs --tail=200 backend || true
          exit 1
          EOF

      - name: Revoke runner SSH ingress
        if: always()
        run: |
          if [ -n "${STAGING_SECURITY_GROUP_ID:-}" ] && [ -n "${RUNNER_PUBLIC_IP:-}" ]; then
            aws ec2 revoke-security-group-ingress \
              --region "${AWS_REGION}" \
              --group-id "${STAGING_SECURITY_GROUP_ID}" \
              --protocol tcp \
              --port 22 \
              --cidr "${RUNNER_PUBLIC_IP}/32" || true
          fi
