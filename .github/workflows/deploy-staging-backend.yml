name: Deploy Staging Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'bin/**'
      - 'pom.xml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'infra/aws/compose/platform/staging/fragments/**'
      - 'infra/aws/cloudformation/staging-minimal.yaml'
      - '.github/workflows/deploy-staging-backend.yml'

env:
  AWS_REGION: eu-west-3
  FRAGMENTS_STACK_NAME: fragments-staging-minimal
  PLATFORM_STACK_NAME: platform-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test backend deployment guard
        run: |
          ./mvnw -q \
            -Dtest=BoundedContextArchitectureTest,StoragePresignerWiringTest,CreateArticleCommandHandlerTest,MakeLikeCommandHandlerTest,CreateCommentCommandHandlerTest,UpdateCommentCommandHandlerTest,IntegrationEventDestinationResolverTest,DeleteCommentCommandHandlerTest,VerifyTicketCommandHandlerTest,IntegrationEventEnvelopeFactoryTest,StableEnvelopeOutboxEventSenderTest,OutboxDomainEventPublisherTest,BusHandlerRegistrationListenerTest,AdminTokenSecurityTest,CreateCoffeeCommandHandlerTest,HttpGooglePlacePhotosGatewayTest,ImportGooglePhotosForCoffeeTest,CoffeePhotosImportedEventHandlerTest,CoffeePhotoCommandHandlerTest,CoffeePhotoAddedEventHandlerTest,CoffeePhotoDeletedEventHandlerTest \
            test

      - name: Package backend
        run: ./mvnw -q -DskipTests package

      - name: Validate deployment scripts
        run: |
          bash -n infra/aws/compose/platform/staging/fragments/bootstrap-runtime.sh
          bash -n infra/aws/compose/platform/staging/fragments/deploy-via-ssm.sh

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::851725375299:role/fragments-staging-github-ssm-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS deployment targets
        run: |
          set -euo pipefail
          ecr_repository="$(aws cloudformation describe-stacks \
            --region "${AWS_REGION}" \
            --stack-name "${FRAGMENTS_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='EcrRepositoryUri'].OutputValue | [0]" \
            --output text)"
          platform_instance_id="$(aws cloudformation describe-stacks \
            --region "${AWS_REGION}" \
            --stack-name "${PLATFORM_STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue | [0]" \
            --output text)"
          test -n "${ecr_repository}"
          test "${ecr_repository}" != "None"
          test -n "${platform_instance_id}"
          test "${platform_instance_id}" != "None"
          case "${ecr_repository}" in
            *.dkr.ecr.${AWS_REGION}.amazonaws.com/fragments/staging/backend) ;;
            *) echo "Unexpected ECR repository: ${ecr_repository}" >&2; exit 1 ;;
          esac
          case "${platform_instance_id}" in
            i-*) ;;
            *) echo "Unexpected platform instance id." >&2; exit 1 ;;
          esac
          echo "ECR_REPOSITORY=${ecr_repository}" >> "${GITHUB_ENV}"
          echo "PLATFORM_INSTANCE_ID=${platform_instance_id}" >> "${GITHUB_ENV}"

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push staging backend image
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --tag "${ECR_REPOSITORY}:${IMAGE_TAG}" \
            --tag "${ECR_REPOSITORY}:staging-latest" \
            --file Dockerfile \
            . \
            --push

      - name: Deploy on platform instance through SSM
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          deploy_script_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/infra/aws/compose/platform/staging/fragments/deploy-via-ssm.sh"
          backend_image="${ECR_REPOSITORY}:${IMAGE_TAG}"
          remote_command="curl --fail --silent --show-error --location '${deploy_script_url}' --output /tmp/fragments-deploy-via-ssm.sh && chmod 700 /tmp/fragments-deploy-via-ssm.sh && /tmp/fragments-deploy-via-ssm.sh '${backend_image}' '${GITHUB_SHA}'"
          command_parameters="$(jq -nc --arg command "${remote_command}" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${PLATFORM_INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Fragments ${GITHUB_SHA}" \
            --parameters "${command_parameters}" \
            --query 'Command.CommandId' \
            --output text)"

          for _ in $(seq 1 120); do
            status="$(aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${command_id}" \
              --instance-id "${PLATFORM_INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || true)"
            case "${status}" in
              Success)
                aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "${command_id}" \
                  --instance-id "${PLATFORM_INSTANCE_ID}" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "${command_id}" \
                  --instance-id "${PLATFORM_INSTANCE_ID}" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "SSM deployment did not complete before the workflow timeout." >&2
          exit 1

      - name: Verify deployed image through SSM
        env:
          EXPECTED_IMAGE: ${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          verify_command="running_image=\$(docker inspect staging-fragments-backend-1 --format '{{.Config.Image}}') && test \"\${running_image}\" = '${EXPECTED_IMAGE}' && curl --fail --silent --show-error https://fragments-staging.anchor-event.fr/actuator/health"
          command_parameters="$(jq -nc --arg command "${verify_command}" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${PLATFORM_INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "Verify Fragments ${GITHUB_SHA}" \
            --parameters "${command_parameters}" \
            --query 'Command.CommandId' \
            --output text)"
          aws ssm wait command-executed \
            --region "${AWS_REGION}" \
            --command-id "${command_id}" \
            --instance-id "${PLATFORM_INSTANCE_ID}"
          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${command_id}" \
            --instance-id "${PLATFORM_INSTANCE_ID}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
