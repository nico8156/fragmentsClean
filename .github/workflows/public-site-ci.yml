name: Public site CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/aws/compose/platform/staging/Caddyfile'
      - 'infra/aws/compose/platform/staging/fragments/public-site/**'
      - 'scripts/test-fragments-public-site*.mjs'
      - '.github/workflows/public-site-ci.yml'
  push:
    branches: [main]
    paths:
      - 'infra/aws/compose/platform/staging/Caddyfile'
      - 'infra/aws/compose/platform/staging/fragments/public-site/**'
      - 'scripts/test-fragments-public-site*.mjs'
      - '.github/workflows/public-site-ci.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify Node
        run: node --version
      - name: Verify static site and Caddy routing
        run: |
          node --test scripts/test-fragments-public-site.mjs
          node --test scripts/test-fragments-public-site-infra.mjs
