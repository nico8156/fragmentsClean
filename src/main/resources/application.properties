spring.application.name=fragmentsClean
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5441/fragmentsclean?stringtype=unspecified}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database=postgresql
spring.datasource.username=fragments
spring.datasource.password=fragments
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.servlet.multipart.max-file-size=${FRAGMENTS_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${FRAGMENTS_MULTIPART_MAX_REQUEST_SIZE:10MB}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

auth.jwt.access-token-ttl=${AUTH_JWT_ACCESS_TOKEN_TTL:PT15M}
auth.jwt.refresh-token-ttl=${AUTH_JWT_REFRESH_TOKEN_TTL:P30D}
auth.jwt.secret=${AUTH_JWT_SECRET:test-secret-change-me-min-32-chars-xxxx}
auth.jwt.issuer=${AUTH_JWT_ISSUER:https://auth.fragments}

app.messaging.local-event-bus.enabled=${APP_MESSAGING_LOCAL_EVENT_BUS_ENABLED:true}
app.messaging.sqs.enabled=${APP_MESSAGING_SQS_ENABLED:false}
app.messaging.sqs.region=${AWS_REGION:eu-west-3}
app.messaging.sqs.queues.articles-events=${SQS_ARTICLES_EVENTS_URL:}
app.messaging.sqs.queues.auth-users-events=${SQS_AUTH_USERS_EVENTS_URL:}
app.messaging.sqs.queues.app-users-events=${SQS_APP_USERS_EVENTS_URL:}
app.messaging.sqs.queues.coffees-events=${SQS_COFFEES_EVENTS_URL:}
app.messaging.sqs.queues.domain-events=${SQS_DOMAIN_EVENTS_URL:}
app.messaging.sqs.queues.ticket-events=${SQS_TICKET_EVENTS_URL:}
app.messaging.sqs.queues.ticket-verification-requested=${SQS_TICKET_VERIFICATION_REQUESTED_URL:}
app.messaging.sqs.max-messages=${APP_MESSAGING_SQS_MAX_MESSAGES:5}
app.messaging.sqs.wait-time=${APP_MESSAGING_SQS_WAIT_TIME:PT20S}
app.messaging.sqs.visibility-timeout=${APP_MESSAGING_SQS_VISIBILITY_TIMEOUT:PT30S}
app.messaging.sqs.shutdown-timeout=${APP_MESSAGING_SQS_SHUTDOWN_TIMEOUT:PT5S}

google.oauth.mobile-ios-client-id=${GOOGLE_MOBILE_IOS_CLIENT_ID:}
google.oauth.mobile-ios-redirect-uri=${GOOGLE_MOBILE_IOS_REDIRECT_URI:com.googleusercontent.apps.255942605258-jisbuvlprrs8pp2qb6ft3psa6hg650fe:/oauthredirect}
google.oauth.studio-client-id=${GOOGLE_STUDIO_CLIENT_ID:}
google.oauth.studio-redirect-uri=${GOOGLE_STUDIO_REDIRECT_URI:}
google.oauth.token-uri=https://oauth2.googleapis.com/token
google.oauth.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo

google.places.api-key=${GOOGLE_PLACES_API_KEY:}
google.places.base-url=${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com/v1}
google.places.language-code=${GOOGLE_PLACES_LANGUAGE_CODE:fr}
google.places.region-code=${GOOGLE_PLACES_REGION_CODE:FR}
google.places.max-search-results=${GOOGLE_PLACES_MAX_SEARCH_RESULTS:10}
google.places.photo-max-width-px=${GOOGLE_PLACES_PHOTO_MAX_WIDTH_PX:1200}
google.places.photo-import-limit=${GOOGLE_PLACES_PHOTO_IMPORT_LIMIT:3}

coffee.photos.storage.directory=${COFFEE_PHOTOS_STORAGE_DIRECTORY:/tmp/fragments-coffee-photos}
coffee.photos.storage.public-base-url=${COFFEE_PHOTOS_PUBLIC_BASE_URL:}
coffee.photos.storage.backend=${COFFEE_PHOTOS_STORAGE_BACKEND:local}
coffee.photos.storage.s3-bucket=${COFFEE_PHOTOS_S3_BUCKET:}
coffee.photos.storage.s3-prefix=${COFFEE_PHOTOS_S3_PREFIX:fragments/staging/coffees}
coffee.photos.storage.s3-region=${COFFEE_PHOTOS_S3_REGION:${AWS_REGION:eu-west-3}}
coffee.photos.storage.s3-endpoint-override=${COFFEE_PHOTOS_S3_ENDPOINT_OVERRIDE:}
coffee.photos.storage.s3-presign-ttl=${COFFEE_PHOTOS_S3_PRESIGN_TTL:PT15M}
coffee.read.seed.enabled=${COFFEE_READ_SEED_ENABLED:false}

article.images.storage.directory=${ARTICLE_IMAGES_STORAGE_DIRECTORY:/tmp/fragments-article-images}
article.images.storage.public-base-url=${ARTICLE_IMAGES_PUBLIC_BASE_URL:}
article.images.storage.backend=${ARTICLE_IMAGES_STORAGE_BACKEND:local}
article.images.storage.s3-bucket=${ARTICLE_IMAGES_S3_BUCKET:}
article.images.storage.s3-prefix=${ARTICLE_IMAGES_S3_PREFIX:fragments/staging/articles}
article.images.storage.s3-region=${ARTICLE_IMAGES_S3_REGION:${AWS_REGION:eu-west-3}}
article.images.storage.s3-endpoint-override=${ARTICLE_IMAGES_S3_ENDPOINT_OVERRIDE:}
article.images.storage.s3-presign-ttl=${ARTICLE_IMAGES_S3_PRESIGN_TTL:PT15M}

admin.security.token=${ADMIN_SECURITY_TOKEN:}
admin.security.bootstrap-user-ids=${ADMIN_SECURITY_BOOTSTRAP_USER_IDS:}
admin.security.bootstrap-emails=${ADMIN_SECURITY_BOOTSTRAP_EMAILS:}

fragments.cors.allowed-origins=${FRAGMENTS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
fragments.cors.allowed-methods=${FRAGMENTS_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
fragments.cors.allowed-headers=${FRAGMENTS_CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Requested-With,Last-Event-ID}
fragments.cors.exposed-headers=${FRAGMENTS_CORS_EXPOSED_HEADERS:Location}
fragments.cors.allow-credentials=${FRAGMENTS_CORS_ALLOW_CREDENTIALS:false}
fragments.cors.max-age=${FRAGMENTS_CORS_MAX_AGE:3600}

fragments.sync.sse.timeout-ms=${FRAGMENTS_SYNC_SSE_TIMEOUT_MS:300000}
fragments.sync.sse.heartbeat-interval-ms=${FRAGMENTS_SYNC_SSE_HEARTBEAT_INTERVAL_MS:25000}
fragments.sync.sse.retry-ms=${FRAGMENTS_SYNC_SSE_RETRY_MS:5000}
fragments.sync.sse.poll-interval-ms=${FRAGMENTS_SYNC_SSE_POLL_INTERVAL_MS:1000}
fragments.sync.sse.replay-batch-size=${FRAGMENTS_SYNC_SSE_REPLAY_BATCH_SIZE:100}

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.project-id=${OPENAI_PROJECT_ID}
spring.ai.openai.base-url=https://api.openai.com
spring.ai.openai.chat.options.temperature=0

ticketverify.binary-path=${TICKETVERIFY_BINARY_PATH:/Users/nicolasmaldiney/fragmentsClean/bin/ticketverify}
ticketverify.timeout-ms=${TICKETVERIFY_TIMEOUT_MS:1500}
