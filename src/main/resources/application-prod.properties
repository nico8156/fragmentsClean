spring.sql.init.mode=never

auth.jwt.secret=${AUTH_JWT_SECRET}
auth.jwt.issuer=${AUTH_JWT_ISSUER:https://auth.fragments}

google.oauth.mobile-ios-client-id=${GOOGLE_MOBILE_IOS_CLIENT_ID}
google.oauth.mobile-ios-redirect-uri=${GOOGLE_MOBILE_IOS_REDIRECT_URI}

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.project-id=${OPENAI_PROJECT_ID}

app.messaging.local-event-bus.enabled=false
app.messaging.sqs.enabled=true
app.messaging.transport.logging.enabled=true

ticketverify.binary-path=${TICKETVERIFY_BINARY_PATH:/app/bin/ticketverify}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
